name: Publish to npm

on:
  push:
    tags: ["v*"]
  # Manual run of the `diagnose-oidc` job only (never publishes).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-oidc:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Try the npm OIDC token exchange and report why it fails
        run: |
          echo "npm $(npm --version), node $(node --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then echo "id-token env MISSING"; exit 1; fi
          JWT=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')
          # Only non-secret claims are printed; the token itself never is.
          echo "$JWT" | cut -d. -f2 | node -e '
            const c = JSON.parse(Buffer.from(require("fs").readFileSync(0, "utf8").trim(), "base64url"));
            const { sub, repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, aud } = c;
            console.log(JSON.stringify({ sub, repository, repository_owner, workflow_ref, job_workflow_ref, environment, ref, aud }, null, 1));
          '
          curl -sS -o resp.json -w "exchange HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $JWT" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40alishenriques%2Fdesign-system"
          node -e '
            const r = JSON.parse(require("fs").readFileSync("resp.json", "utf8"));
            console.log(r.token ? "token received (hidden)" : JSON.stringify(r));
          '

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url here on purpose: setup-node always writes an
          # authToken line to .npmrc from NODE_AUTH_TOKEN when it's set, even
          # if that var is empty (we don't use an NPM_TOKEN secret). An empty
          # authToken breaks npm's OIDC trusted-publishing auto-detection —
          # this caused the v0.2.0 publish to 404. npm defaults to
          # registry.npmjs.org on its own.
      - run: corepack enable
      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Ensure tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Authenticates via OIDC (npm Trusted Publisher); no NPM_TOKEN secret needed.
      - run: npm publish --provenance --access public
